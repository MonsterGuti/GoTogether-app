{% extends 'rides/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h3 class="fw-bold text-center mb-3">Забравена парола</h3>
            <p class="text-muted small text-center mb-4">Въведете вашия имейл адрес и ще ви изпратим линк за нулиране на паролата.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Имейл адрес</label>
                    <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Изпрати линк</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
