{% extends 'rides/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h3 class="fw-bold text-center mb-3">Нова парола</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Запази новата парола</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
