{% extends 'rides/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
            <div class="mb-3">
                <i class="bi bi-envelope-check text-primary display-4"></i>
            </div>
            <h3 class="fw-bold mb-3">Проверете пощата си</h3>
            <p class="text-muted mb-4">
                Изпратихме инструкции за нулиране на паролата на посочения от вас имейл адрес.
            </p>
            <p class="text-muted small mb-4">
                Ако не получите имейла до няколко минути, проверете папка <strong>Спам / Нежелана поща</strong>.
            </p>
            <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 py-2 fw-bold rounded-3">
                Обратно към вход
            </a>
        </div>
    </div>
</div>
{% endblock %}
